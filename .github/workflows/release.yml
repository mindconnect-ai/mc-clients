# Builds the native installers — one per platform, each with a bundled Java
# runtime — and attaches them to the GitHub release for the pushed tag.
# Trigger: push a tag like v1.0.0.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installers:
    strategy:
      matrix:
        include:
          - os: macos-latest        # Apple silicon
            type: DMG
            suffix: mac-aarch64
            ext: dmg
            icon: icon.icns
          - os: macos-13            # Intel Mac
            type: DMG
            suffix: mac-x64
            ext: dmg
            icon: icon.icns
          - os: windows-latest
            type: MSI
            suffix: windows-x64
            ext: msi
            icon: icon.ico
          - os: ubuntu-latest
            type: DEB
            suffix: linux-x64
            ext: deb
            icon: icon.png
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build installer
        shell: bash
        run: |
          mvn -B -f javafx/pom.xml -pl mc-agent-admin-launcher -am \
              -Pinstaller package
          mvn -B -f javafx/pom.xml -pl mc-agent-admin-launcher \
              -Pinstaller jpackage:jpackage \
              -Djpackage.type=${{ matrix.type }} \
              "-Djpackage.icon=$PWD/javafx/mc-agent-admin-launcher/packaging/${{ matrix.icon }}"

      - name: Name the artifacts after their platform
        shell: bash
        run: |
          cd javafx/mc-agent-admin-launcher/target
          ver="${GITHUB_REF_NAME#v}"
          # the installer with the bundled runtime …
          src=$(ls installer/*.${{ matrix.ext }})
          mv "$src" "installer/mindconnect-admin-launcher-${ver}-${{ matrix.suffix }}.${{ matrix.ext }}"
          # … and the plain fat jar as the Gatekeeper-free `java -jar` fallback.
          # JavaFX natives are platform-bound, so the jar is per platform too.
          cp mc-agent-admin-launcher-*-all.jar \
             "installer/mindconnect-admin-launcher-${ver}-${{ matrix.suffix }}-all.jar"

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            javafx/mc-agent-admin-launcher/target/installer/*.${{ matrix.ext }}
            javafx/mc-agent-admin-launcher/target/installer/*-all.jar

